<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local responsive width QA</title><style>html,body{margin:0;padding:0;background:#080808}iframe{display:block;border:0;height:12000px}</style></head><body><script>const width=Number(new URLSearchParams(location.search).get('w'))||390;for(const [id,src] of [['home','/'],['shop','/shop']]){const frame=document.createElement('iframe');frame.id=id;frame.src=src;frame.style.width=width+'px';frame.title=id+' at '+width+' CSS pixels';document.body.append(frame)}</script></body></html>
