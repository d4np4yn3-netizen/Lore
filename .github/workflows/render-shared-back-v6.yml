name: Render LORE Shared Back v6 PNG

on:
  push:
    branches:
      - review/shared-back-v6-print
    paths:
      - cards/review/shared-back-v6-print/LORE-Shared-Back-v6-Print-v1.svg
      - .github/workflows/render-shared-back-v6.yml

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/shared-back-v6-print

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin python3-pil

      - name: Render exact SVG to PNG
        run: |
          rsvg-convert \
            -w 816 \
            -h 1110 \
            cards/review/shared-back-v6-print/LORE-Shared-Back-v6-Print-v1.svg \
            -o /tmp/LORE-Shared-Back-v6-Print-v1.png

          python3 - <<'PY'
          from PIL import Image
          src = "/tmp/LORE-Shared-Back-v6-Print-v1.png"
          dst = "cards/review/shared-back-v6-print/LORE-Shared-Back-v6-Print-v1.png"
          im = Image.open(src).convert("RGB")
          if im.size != (816, 1110):
              raise SystemExit(f"Unexpected size: {im.size}")
          im.save(dst, "PNG", dpi=(300, 300), optimize=True)
          check = Image.open(dst)
          print("size=", check.size, "dpi=", check.info.get("dpi"))
          PY

      - name: Commit PNG beside SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/review/shared-back-v6-print/LORE-Shared-Back-v6-Print-v1.png
          if git diff --cached --quiet; then
            echo "PNG already current"
          else
            git commit -m "Add PNG render for LORE shared back v6"
            git push origin HEAD:review/shared-back-v6-print
          fi
