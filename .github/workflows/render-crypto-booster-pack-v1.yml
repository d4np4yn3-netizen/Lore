name: Render LORE Crypto Booster Pack v1

on:
  push:
    branches:
      - review/crypto-booster-pack-v1
    paths:
      - packs/crypto/season-01/booster-pack-v1/**
      - .github/workflows/render-crypto-booster-pack-v1.yml

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/crypto-booster-pack-v1

      - name: Install Pillow
        run: python -m pip install --upgrade pillow cairosvg

      - name: Render pack
        run: python packs/crypto/season-01/booster-pack-v1/render_pack.py

      - name: Commit renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/crypto/season-01/booster-pack-v1/*.png packs/crypto/season-01/booster-pack-v1/front-preview-base64.txt
          if git diff --cached --quiet; then
            echo "No render changes"
          else
            git commit -m "Render LORE Crypto booster pack v1"
            git push origin HEAD:review/crypto-booster-pack-v1
          fi
